name: RAG quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rag-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix blog-ai-api test
      - run: npm --prefix blog-ai-api run eval:hybrid
      - run: npm --prefix blog-ai-api run eval:agent
      - run: npm --prefix blog-ai-api run eval:phase4
